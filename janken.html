<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>じゃんけんゲーム</title>
<script src="janken.js" type="text/javascript">
</script>
</head>
<body>
<h1>じゃんけんゲーム</h1>
ルール：グー・チョキ・パーから1つ選んでOKボタンを押すと、じゃんけんができます。じゃんけんの結果は下に表示されます。先に2勝差をつけた方の勝ちとなります。ゲーム開始ボタンを押すと、結果がリセットされ、新たにゲームを始めることができます。
<hr>
<button onclick="init()">ゲーム開始</button>
<br>
じゃんけんの手を選択してください
<input type="radio" name="jk" value="0">グー
<input type="radio" name="jk" value="1">チョキ
<input type="radio" name="jk" value="2">パー
<button onclick="judge()">OK</button>
<br>
<span id="result"></span>
</body>
</html>
